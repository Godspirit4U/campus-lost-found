<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/js/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
  <title>Home | Campus Lost and Found</title>
</head>
<body>
  <div class="app">
    <div id="site-header"></div>
    <div class="app-main">
      <div id="topbar"></div>

      <main>
        <section class="page-head">
          <div class="container">
            <h1>Home</h1>
            <p id="welcome">Loading your account</p>
          </div>
        </section>

        <section class="section section--tight">
          <div class="container">
            <div class="stat-grid" id="summary" style="margin-bottom:30px"></div>

            <div class="tabs" role="tablist">
              <button role="tab" data-tab="my-listings" aria-selected="true">My listings</button>
              <button role="tab" data-tab="my-claims">My claims</button>
              <button role="tab" data-tab="claims-on-my-items">Claims on my items</button>
              <button role="tab" data-tab="notifications">Notifications</button>
            </div>

            <div id="panel"></div>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <div class="container">
          <span>Campus Lost and Found Portal</span>
          <span>Sai University</span>
        </div>
      </footer>
    </div>
  </div>
  <script type="module" src="/js/dashboard.js"></script>
</body>
</html>
